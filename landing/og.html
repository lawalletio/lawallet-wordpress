<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; position: relative; color: #0b1020;
      background: radial-gradient(120% 105% at 50% -12%, #ffffff 0%, #f4eefc 50%, #ece4f7 100%); }
    .wm { position: absolute; inset: 0; background: url('assets/wp-woo-pattern.svg') repeat; background-size: 156px; opacity: 0.5; }
    .vig { position: absolute; inset: 0; background: radial-gradient(58% 64% at 50% 42%, rgba(255,255,255,0.92), rgba(255,255,255,0) 76%); }
    .btc { position: absolute; top: 48px; left: 60px; width: 66px; height: 66px; filter: drop-shadow(0 10px 20px rgba(247,147,26,0.28)); }
    .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 50px 80px 0; }
    .lockup { display: inline-flex; align-items: center; gap: 26px; background: #fff; border: 1px solid #e7e3f0;
      border-radius: 20px; padding: 18px 30px; margin-bottom: 34px; box-shadow: 0 18px 44px -20px rgba(60,40,120,0.45); }
    .lockup .wp { height: 52px; width: auto; }
    .lockup .woo { height: 44px; width: auto; }
    .lockup .div { width: 1px; height: 46px; background: #e6e1ee; }
    h1 { font-size: 86px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; }
    h1 .grad { background: linear-gradient(100deg, #3858E9, #873EFF 52%, #00a98c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .pill { margin-top: 24px; display: inline-block; font-size: 24px; font-weight: 700; color: #6d28d9;
      background: #f4ecfd; border: 1px solid #e1cffb; border-radius: 999px; padding: 10px 24px; }
    .foot { position: absolute; left: 64px; right: 64px; bottom: 46px; display: flex; align-items: center; justify-content: space-between; }
    .hl { font-size: 27px; font-weight: 700; color: #1c1a17; }
    .hl em { color: #b9a9e0; font-style: normal; margin: 0 6px; }
    .by { display: inline-flex; align-items: center; gap: 12px; font-size: 26px; color: #6b6577; font-weight: 500; }
    .by img { height: 38px; width: auto; }
    .by b { color: #0b1020; font-weight: 800; }
  </style>
</head>
<body>
  <div class="wm"></div>
  <div class="vig"></div>
  <img class="btc" src="assets/bitcoin.svg" alt="" />
  <div class="wrap">
    <div class="lockup">
      <img class="wp" src="assets/wordpress.png" alt="WordPress" />
      <span class="div"></span>
      <img class="woo" src="assets/woocommerce-2015.svg" alt="WooCommerce" />
    </div>
    <h1>Accept Bitcoin<br /><span class="grad">via Lightning Address</span></h1>
    <span class="pill">WooCommerce Plugin</span>
  </div>
  <div class="foot">
    <span class="hl">No registration required <em>&middot;</em> public Lightning Address</span>
    <span class="by">by <img src="assets/lawallet-icon.svg" alt="" /> <b>LaWallet</b></span>
  </div>
</body>
</html>
