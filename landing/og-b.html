<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; position: relative; color: #0b1020;
      background: radial-gradient(120% 120% at 80% -10%, #ffffff 0%, #f4eefc 52%, #e9e0f6 100%); }
    .wm { position: absolute; inset: 0; background: url('assets/wp-woo-pattern.svg') repeat; background-size: 156px; opacity: 0.45; }
    .row { position: relative; height: 100%; display: flex; align-items: center; gap: 56px; padding: 0 80px; }
    .left { flex: 1; }
    .pill { display: inline-flex; align-items: center; font-size: 22px; font-weight: 700; color: #6d28d9;
      background: #f4ecfd; border: 1px solid #e1cffb; border-radius: 999px; padding: 9px 20px; }
    h1 { margin-top: 24px; font-size: 74px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
    h1 .grad { background: linear-gradient(100deg, #3858E9, #873EFF 52%, #00a98c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hl { margin-top: 26px; font-size: 30px; font-weight: 700; color: #1c1a17; line-height: 1.3; }
    .hl b { background: linear-gradient(100deg,#3858E9,#873EFF); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .by { margin-top: 34px; display: inline-flex; align-items: center; gap: 12px; font-size: 26px; color: #6b6577; font-weight: 500; }
    .by img { height: 40px; width: auto; }
    .by b { color: #0b1020; font-weight: 800; }
    .right { flex: 0 0 350px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
    .card { background: #fff; border: 1px solid #e7e3f0; border-radius: 22px; padding: 28px 34px; display: flex; flex-direction: column; align-items: center; gap: 24px; box-shadow: 0 24px 56px -24px rgba(60,40,120,0.5); }
    .card .wp { width: 132px; height: auto; }
    .card .woo { width: 270px; height: auto; }
    .card .div { width: 150px; height: 1px; background: #ece7f3; }
    .btc { width: 70px; height: 70px; filter: drop-shadow(0 10px 18px rgba(247,147,26,0.3)); }
  </style>
</head>
<body>
  <div class="wm"></div>
  <div class="row">
    <div class="left">
      <span class="pill">WooCommerce Plugin</span>
      <h1>Accept Bitcoin <span class="grad">via Lightning Address</span></h1>
      <p class="hl"><b>No registration required</b><br />just your public Lightning Address</p>
      <span class="by">by <img src="assets/lawallet-icon.svg" alt="" /> <b>LaWallet</b></span>
    </div>
    <div class="right">
      <div class="card">
        <img class="wp" src="assets/wordpress.png" alt="WordPress" />
        <span class="div"></span>
        <img class="woo" src="assets/woocommerce-2015.svg" alt="WooCommerce" />
      </div>
      <img class="btc" src="assets/bitcoin.svg" alt="" />
    </div>
  </div>
</body>
</html>
