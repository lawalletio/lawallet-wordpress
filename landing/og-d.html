<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; position: relative; color: #0b1020;
      background: radial-gradient(120% 105% at 50% -12%, #ffffff 0%, #f4eefc 50%, #ece4f7 100%); }
    .wm { position: absolute; inset: 0; background: url('assets/wp-woo-pattern.svg') repeat; background-size: 156px; opacity: 0.42; }
    .vig { position: absolute; inset: 0; background: radial-gradient(60% 66% at 50% 44%, rgba(255,255,255,0.9), rgba(255,255,255,0) 78%); }
    .grad { background: linear-gradient(100deg, #3858E9, #873EFF 52%, #00a98c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .btc { position: absolute; top: 46px; right: 64px; width: 60px; height: 60px; filter: drop-shadow(0 8px 16px rgba(247,147,26,0.3)); }
    .brand { position: absolute; left: 80px; bottom: 44px; height: 38px; width: auto; }
    .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 60px 0; }
    .lockup { display: inline-flex; align-items: center; gap: 20px; background: #fff; border: 1px solid #e7e3f0; border-radius: 16px; padding: 11px 22px; margin-bottom: 22px; box-shadow: 0 14px 36px -20px rgba(60,40,120,0.4); }
    .lockup .wp { height: 36px; width: auto; } .lockup .woo { height: 30px; width: auto; } .lockup .div { width: 1px; height: 30px; background: #e6e1ee; }
    h1 { font-size: 76px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.14; }
    h1 .grad { display: inline-block; line-height: 1.2; padding-bottom: 6px; }
    .cap { margin-top: 12px; font-size: 24px; font-weight: 600; color: #6b6577; }
    .wallets { display: flex; gap: 16px; justify-content: center; margin-top: 38px; }
    .chip { width: 96px; height: 96px; border-radius: 22px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 16px; box-shadow: 0 14px 32px -18px rgba(40,40,80,0.45); }
    .chip img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <div class="wm"></div>
  <div class="vig"></div>
  <img class="btc" src="assets/bitcoin.svg" alt="" />
  <img class="brand" src="assets/lawallet-logo.svg" alt="LaWallet" />
  <div class="wrap">
    <div class="lockup">
      <img class="wp" src="assets/wordpress.png" alt="WordPress" />
      <span class="div"></span>
      <img class="woo" src="assets/woocommerce-2015.svg" alt="WooCommerce" />
    </div>
    <h1>Accept Bitcoin <span class="grad">with any wallet</span></h1>
    <div class="cap">WooCommerce Plugin &middot; No registration required</div>
    <div class="wallets">
      <span class="chip"><img src="assets/wallets/wallet-of-satoshi.png" alt="Wallet of Satoshi" /></span>
      <span class="chip"><img src="assets/wallets/primal.svg" alt="Primal" /></span>
      <span class="chip"><img src="assets/wallets/strike.png" alt="Strike" /></span>
      <span class="chip"><img src="assets/wallets/alby.svg" alt="Alby" /></span>
      <span class="chip"><img src="assets/wallets/coincorner.svg" alt="CoinCorner" /></span>
      <span class="chip"><img src="assets/wallets/spark.png" alt="Spark" /></span>
      <span class="chip"><img src="assets/wallets/lnbits.svg" alt="LNbits" /></span>
      <span class="chip"><img src="assets/lawallet-icon.svg" alt="LaWallet" /></span>
    </div>
  </div>
</body>
</html>
