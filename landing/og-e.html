<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; position: relative; color: #0b1020;
      background: radial-gradient(120% 105% at 50% -12%, #ffffff 0%, #f4eefc 50%, #ece4f7 100%); }
    .wm { position: absolute; inset: 0; background: url('assets/wp-woo-pattern.svg') repeat; background-size: 156px; opacity: 0.4; }
    .vig { position: absolute; inset: 0; background: radial-gradient(46% 56% at 50% 48%, rgba(255,255,255,0.96), rgba(255,255,255,0.55) 60%, rgba(255,255,255,0) 80%); }
    .grad { background: linear-gradient(100deg, #3858E9, #873EFF 52%, #00a98c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand { position: absolute; left: 80px; bottom: 46px; height: 46px; width: auto; z-index: 4; }
    .chip { position: absolute; width: 80px; height: 80px; border-radius: 20px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 13px; box-shadow: 0 14px 30px -16px rgba(40,40,80,0.5); z-index: 2; }
    .chip img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .wrap { position: relative; z-index: 3; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 80px; }
    .pill { display: inline-block; font-size: 23px; font-weight: 700; color: #6d28d9; background: #f4ecfd; border: 1px solid #e1cffb; border-radius: 999px; padding: 9px 22px; margin-bottom: 22px; }
    h1 { font-size: 84px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.0; }
    h1 .grad { font-size: 50px; display: block; margin-top: 6px; }
    .sub { margin-top: 22px; font-size: 26px; font-weight: 700; color: #1c1a17; }
  </style>
</head>
<body>
  <div class="wm"></div>
  <div class="vig"></div>

  <span class="chip" style="top:46px;left:70px;transform:rotate(-7deg)"><img src="assets/wallets/wallet-of-satoshi.png" alt="" /></span>
  <span class="chip" style="top:104px;left:320px;transform:rotate(5deg)"><img src="assets/wallets/primal.svg" alt="" /></span>
  <span class="chip" style="top:50px;right:336px;transform:rotate(-4deg)"><img src="assets/wallets/strike.png" alt="" /></span>
  <span class="chip" style="top:58px;right:74px;transform:rotate(8deg)"><img src="assets/wallets/alby.svg" alt="" /></span>
  <span class="chip" style="top:268px;right:44px;transform:rotate(-6deg)"><img src="assets/wallets/coincorner.svg" alt="" /></span>
  <span class="chip" style="bottom:66px;right:104px;transform:rotate(6deg)"><img src="assets/wallets/spark.png" alt="" /></span>
  <span class="chip" style="bottom:48px;right:344px;transform:rotate(-5deg)"><img src="assets/wallets/lnbits.svg" alt="" /></span>
  <span class="chip" style="top:270px;left:44px;transform:rotate(7deg)"><img src="assets/lawallet-icon.svg" alt="" /></span>

  <div class="wrap">
    <span class="pill">WooCommerce Plugin</span>
    <h1>Accept Bitcoin<span class="grad">with any Lightning wallet</span></h1>
    <div class="sub">No registration required &middot; public Lightning Address</div>
  </div>

  <img class="brand" src="assets/lawallet-logo.svg" alt="LaWallet" />
</body>
</html>
